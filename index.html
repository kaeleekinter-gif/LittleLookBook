
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Coloring Book</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f4ed;color:#42443d;font-family:Arial,sans-serif}
header{padding:22px;text-align:center}
header h1{font-family:Georgia,serif;font-size:32px;font-weight:normal;margin:0}
header p{color:#888;margin:8px 0 0;font-size:13px}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px}
button{border:0;border-radius:22px;padding:11px 17px;background:#e9e3d9;color:#45453f;cursor:pointer;font-size:13px}
button:hover{background:#dcd1c4}
button.active{background:#d8a8ad;color:white}
main{max-width:1100px;margin:auto;padding:16px}
#gallery{display:block}
#pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px;margin-top:20px}
.page-card{background:white;padding:10px;border-radius:15px;cursor:pointer;border:1px solid #eee6dc;transition:.15s}
.page-card:hover{transform:translateY(-3px)}
.page-card svg{width:100%;height:auto;display:block;background:#fffdf9;border-radius:9px}
.page-card p{text-align:center;font-size:13px;margin:10px 0 3px}
#editor{display:none}
.editor-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.editor-top h2{font-family:Georgia,serif;font-weight:normal;font-size:22px}
.canvas-wrap{background:white;border-radius:18px;padding:12px;max-width:650px;margin:auto;box-shadow:0 3px 15px #0000000a}
#art{width:100%;height:auto;display:block;touch-action:manipulation}
#art .fillable{fill:white;stroke:#393a35;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;cursor:pointer}
#art .fillable:hover{fill:#f8eff0}
.palette{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:18px 5px}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #ccc;padding:0}
.swatch.selected{box-shadow:0 0 0 3px #777}
.tools{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:5px 0 20px}
.page-controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px}
.small-note{text-align:center;color:#999;font-size:12px}
@media(max-width:500px){#pages{grid-template-columns:repeat(2,1fr)}header h1{font-size:27px}}
</style>
</head>
<body>
<header>
<h1>Little Coloring Book</h1>
<p>A little place to color and create</p>
</header>

<nav>
<button class="active" id="everydayTab" onclick="showCollection('everyday')">Everyday</button>
<button id="christmasTab" onclick="showCollection('christmas')">Christmas</button>
</nav>

<main>
<section id="gallery">
<h2 id="galleryTitle" style="font-family:Georgia,serif;font-weight:normal;text-align:center">Everyday Pages</h2>
<div id="pages"></div>
</section>

<section id="editor">
<div class="editor-top">
<button onclick="backToGallery()">← Gallery</button>
<h2 id="pageTitle"></h2>
<button onclick="resetPage()">Reset</button>
</div>
<div class="canvas-wrap">
<svg id="art" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<div class="palette" id="palette"></div>
<div class="tools">
<button id="fillTool" class="active" onclick="setTool('fill')">Fill</button>
<button id="eraserTool" onclick="setTool('eraser')">Eraser</button>
<button onclick="savePage()">Save page</button>
</div>
<div class="page-controls">
<button onclick="changePage(-1)">Previous</button>
<button onclick="changePage(1)">Next</button>
</div>
<p class="small-note">Choose a color, then tap a section of the picture.</p>
</section>
</main>

<script>
const everyday = [
"Cozy Cottage","Flower Garden","Beach Day","Cat Café","Picnic Day",
"Little Bakery","Greenhouse","Birthday Party","Seaside House","Puppy Park",
"Bookshop","Ice Cream Stand","Rainy Window","Art Studio","Treehouse",
"Farmers Market","Tea Party","Camping Trip","Aquarium","Music Room",
"Fruit Stand","Garden Shed","Pretty Bedroom","Butterfly Meadow","Sunny Café"
];

const christmas = [
"Christmas Living Room","Gingerbread House","Santa's Workshop","Snowy Village",
"Decorating the Tree","Christmas Bakery","Reindeer Stable","Holiday Market",
"Christmas Window","Snowman Family","Sleigh Ride","Cozy Stockings",
"Christmas Train","Holiday Wreath","Snowy Cabin","Candy Cane Lane",
"Winter Tea Party","Christmas Concert","North Pole","Snow Globe",
"Ornament Shop","Fireplace","Christmas Carousel","Gift Shop","Christmas Morning"
];

let collection = "everyday";
let currentIndex = 0;
let currentColor = "#f2a9b5";
let tool = "fill";
let saved = {};

const colors = [
"#f2a9b5","#e9c2d0","#f5c7a0","#f5df8e",
"#b8d4bd","#83aa91","#a9c9df","#80a9c5",
"#c9b5df","#d7c6a8","#f18b50","#e86e69",
"#a8a8a0","#666b64","#ffffff","#42443d"
];

const $ = id => document.getElementById(id);
const titles = () => collection === "everyday" ? everyday : christmas;

function showCollection(which){
 collection = which;
 $("everydayTab").classList.toggle("active",which==="everyday");
 $("christmasTab").classList.toggle("active",which==="christmas");
 $("galleryTitle").textContent = which==="everyday" ? "Everyday Pages" : "Christmas Pages";
 $("gallery").style.display="block";
 $("editor").style.display="none";
 renderGallery();
}

function renderGallery(){
 const pages=$("pages");
 pages.innerHTML="";
 titles().forEach((title,index)=>{
  const card=document.createElement("div");
  card.className="page-card";
  card.innerHTML=`<div class="preview"></div><p>${title}</p>`;
  card.querySelector(".preview").innerHTML=makeScene(index).replace('id="drawing"','');
  card.onclick=()=>openPage(index);
  pages.appendChild(card);
 });
}

function openPage(index){
 currentIndex=index;
 $("gallery").style.display="none";
 $("editor").style.display="block";
 $("pageTitle").textContent=titles()[index];
 drawCurrentPage();
 window.scrollTo({top:0,behavior:"smooth"});
}

function backToGallery(){
 $("editor").style.display="none";
 $("gallery").style.display="block";
 renderGallery();
 window.scrollTo({top:0,behavior:"smooth"});
}

function changePage(amount){
 currentIndex=(currentIndex+amount+titles().length)%titles().length;
 $("pageTitle").textContent=titles()[currentIndex];
 drawCurrentPage();
}

function setTool(next){
 tool=next;
 $("fillTool").classList.toggle("active",tool==="fill");
 $("eraserTool").classList.toggle("active",tool==="eraser");
}

function drawPalette(){
 $("palette").innerHTML="";
 colors.forEach(color=>{
  const b=document.createElement("button");
  b.className="swatch"+(color===currentColor?" selected":"");
  b.style.background=color;
  b.title=color;
  b.onclick=()=>{
   currentColor=color;
   drawPalette();
  };
  $("palette").appendChild(b);
 });
}

function drawCurrentPage(){
 $("art").innerHTML=makeScene(currentIndex);
 $("art").querySelectorAll(".fillable").forEach(shape=>{
  shape.addEventListener("click",()=>{
   shape.style.fill=tool==="eraser"?"white":currentColor;
  });
 });
 drawPalette();
}

function resetPage(){
 $("art").querySelectorAll(".fillable").forEach(shape=>shape.style.fill="white");
}

function savePage(){
 const svg=$("art").cloneNode(true);
 svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
 const data=new XMLSerializer().serializeToString(svg);
 const blob=new Blob([data],{type:"image/svg+xml"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=titles()[currentIndex].replaceAll(" ","-")+".svg";
 a.click();
 URL.revokeObjectURL(url);
}

function shape(tag,attrs=""){
 return `<${tag} class="fillable" ${attrs}/>`;
}
function line(x1,y1,x2,y2){
 return `<path d="M${x1} ${y1} L${x2} ${y2}" fill="none" stroke="#393a35" stroke-width="4" stroke-linecap="round"/>`;
}
function circle(cx,cy,r){
 return shape("circle",`cx="${cx}" cy="${cy}" r="${r}"`);
}
function rect(x,y,w,h,rx=5){
 return shape("rect",`x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"`);
}
function path(d){
 return shape("path",`d="${d}"`);
}
function flower(x,y,s=1){
 let a="";
 for(let i=0;i<8;i++){
  let angle=i*Math.PI/4;
  let px=x+Math.cos(angle)*18*s, py=y+Math.sin(angle)*18*s;
  a+=shape("ellipse",`cx="${px}" cy="${py}" rx="${9*s}" ry="${14*s}" transform="rotate(${i*45} ${px} ${py})"`);
 }
 a+=circle(x,y,9*s);
 return a;
}
function leaf(x,y,angle=0){
 return shape("ellipse",`cx="${x}" cy="${y}" rx="12" ry="6" transform="rotate(${angle} ${x} ${y})"`);
}

function makeScene(index){
 const title=titles()[index];
 const x=index%5;
 let art="";
 const ground=line(35,420,465,420);
 const sky=`
 ${circle(420,75,27)}
 ${path("M35 145 Q80 95 125 145 Q165 90 210 145")}
 `;
 switch(title){
 case "Cozy Cottage":
 case "Snowy Cabin":
 case "Seaside House":
  art+=path("M105 230 L250 105 L395 230 L395 400 L105 400 Z");
  art+=rect(210,295,75,105)+rect(135,260,55,55)+rect(310,260,55,55);
  art+=path("M85 235 L250 80 L415 235 L390 250 L250 125 L110 250 Z");
  art+=rect(225,150,50,65)+circle(263,183,3);
  art+=ground+sky;
  for(let i=0;i<3;i++)art+=flower(65+i*35,390,.8);
  break;
 case "Flower Garden":
 case "Butterfly Meadow":
  art+=ground+sky;
  for(let i=0;i<5;i++){
   let fx=90+i*80, fy=300-(i%2)*30;
   art+=line(fx,fy,fx,410)+flower(fx,fy,.9);
   art+=leaf(fx-13,fy+45,-30)+leaf(fx+13,fy+65,30);
  }
  art+=path("M120 180 Q145 140 170 180 Q145 220 120 180 Z");
  art+=path("M170 180 Q195 140 220 180 Q195 220 170 180 Z");
  art+=circle(170,180,5);
  break;
 case "Beach Day":
 case "Camping Trip":
  art+=path("M35 350 Q140 315 250 350 T465 350 L465 420 L35 420 Z");
  art+=path("M60 345 Q250 310 440 345");
  art+=circle(400,90,35);
  art+=path("M95 345 L180 190 L265 345 Z");
  art+=path("M180 190 L180 345");
  art+=path("M180 190 L265 345");
  art+=rect(300,280,75,60);
  art+=line(300,280,337,240)+line(375,280,337,240);
  art+=ground;
  break;
 case "Cat Café":
 case "Puppy Park":
  art+=circle(250,190,85);
  art+=path("M185 135 L175 70 L225 115 Z");
  art+=path("M275 115 L325 70 L315 135 Z");
  art+=circle(220,190,7)+circle(280,190,7);
  art+=path("M240 215 Q250 230 260 215");
  art+=path("M230 235 Q250 250 270 235");
  art+=path("M175 300 Q250 270 325 300 L345 390 L155 390 Z");
  art+=rect(80,340,80,45)+rect(340,340,80,45);
  art+=ground;
  break;
 case "Little Bakery":
 case "Ice Cream Stand":
 case "Fruit Stand":
  art+=rect(100,210,300,190,12);
  art+=path("M85 210 L120 150 L380 150 L415 210 Z");
  for(let i=0;i<5;i++)art+=path(`M${120+i*55} 150 L${145+i*55} 210`);
  art+=rect(145,260,90,90)+rect(265,260,90,90);
  art+=circle(190,300,22)+circle(310,300,22);
  art+=ground;
  break;
 case "Birthday Party":
 case "Tea Party":
  art+=rect(100,315,300,20);
  art+=rect(130,335,15,75)+rect(355,335,15,75);
  art+=rect(190,250,120,65);
  art+=path("M190 250 Q250 200 310 250 Z");
  art+=circle(250,190,8);
  for(let i=0;i<5;i++)art+=path(`M${90+i*75} 100 Q${70+i*75} 65 ${90+i*75} 35 Q${110+i*75} 65 ${90+i*75} 100 Z`);
  art+=ground;
  break;
 default:
  art+=ground+sky;
  art+=rect(145,190,210,180,12);
  art+=path("M125 200 L250 100 L375 200 Z");
  art+=rect(190,260,55,110)+rect(270,230,55,55);
  art+=circle(300,257,5);
  for(let i=0;i<3;i++)art+=flower(80+i*45,390,.7);
  break;
 }
 // Add a decorative frame and extra fillable details to every page.
 let details="";
 details+=rect(18,18,464,464,22);
 details+=circle(55,55,12)+circle(445,445,12);
 for(let i=0;i<4;i++){
  details+=flower(65+i*120,455,.35);
 }
 return `<g id="drawing">${details}${art}</g>`;
}

renderGallery();
</script>
</body>
</html>
